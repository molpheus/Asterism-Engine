name: CI/CD - Code Quality & Unit Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-analyze:
    name: Build, Test & Code Quality Check
    runs-on: windows-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: 📦 Install .NET Framework 4.8 Developer Pack
      run: |
        Write-Host "Installing .NET Framework 4.8 Developer Pack..."
        choco install netfx-4.8-devpack -y
        
    - name: 🔄 Restore dependencies
      run: |
        Write-Host "Restoring NuGet packages..."
        dotnet restore "Asterism/Common/Common.sln"
      
    - name: 🏗️ Build solution (Code Error Check)
      run: |
        Write-Host "Building solution to check for code errors..."
        dotnet build "Asterism/Common/Common.sln" --configuration Debug --no-restore --verbosity normal
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ Build successful - No code errors found!"
        } else {
          Write-Host "❌ Build failed - Code errors detected!"
          exit $LASTEXITCODE
        }
      
    - name: 🧪 Run Unit Tests
      run: |
        Write-Host "Running unit tests..."
        dotnet test "Asterism/Common/UnitTest/UnitTest.csproj" --configuration Debug --no-build --verbosity normal --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
        
    - name: 📊 Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results
        path: TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: true
        
    - name: 📋 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/
        
    - name: 📈 Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: always()
      with:
        filename: TestResults/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'
        
    - name: ✅ Summary
      if: success()
      run: |
        Write-Host "🎉 All checks passed!"
        Write-Host "✅ Code compilation successful"
        Write-Host "✅ Unit tests passed"
        Write-Host "✅ Code quality check completed"